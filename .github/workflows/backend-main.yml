# Publicación del backend al integrar en main (doc. 04 §9). Por ahora solo los contratos OpenAPI, como releases
# versionadas que descarga el frontend (plan de la feature 001, paso 6; ADR 0027), de la API (backend/) y del BFF
# (backend/bff/, desde que tenga su copia de los scripts en T18). La imagen, el SBOM, la firma y el despliegue a
# staging se agregan con sus tareas (T16 y el resto de F0‑07).
name: backend-main

on:
  push:
    branches: [main]
    paths:
      - 'backend/contracts/**'
      - 'backend/bff/contracts/**'
      - '.github/workflows/backend-main.yml'
  # Para reintentar una publicación que falló, solo desde main.
  workflow_dispatch:

permissions:
  contents: read

# Las publicaciones van en fila, sin cancelarse. GitHub deja una sola en espera: con tres integraciones seguidas,
# la del medio se cancela. Si traía una versión nueva, la siguiente no la publica sin haberla juzgado
# (UNPUBLISHED_EARLIER, en publish.sh): se publica con «Re-run» de la ejecución cancelada.
concurrency:
  group: backend-main
  cancel-in-progress: false

jobs:
  contracts:
    name: ${{ matrix.project }} · publicar contratos
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Crear las releases y sus etiquetas.
      contents: write
      # Leer las etiquetas del PR integrado.
      pull-requests: read
    strategy:
      fail-fast: false
      # Uno a la vez, para no competir por la misma fila de publicación.
      max-parallel: 1
      matrix:
        project: [backend, backend/bff]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      # Con fetch-depth 2 trae el commit anterior de main (squash e historia lineal) contra el que se compara.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Juez y publicador: los scripts del commit anterior, como en backend-contracts-pr. Si aún no los tiene (la
      # integración que los agrega), los de este commit.
      - name: Scripts que juzgan y publican
        id: judge
        working-directory: .
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          if git cat-file -e "HEAD^1:$PROJECT/contracts/scripts/publish.sh" 2> /dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
            echo "dir=$RUNNER_TEMP/base/$PROJECT" >> "$GITHUB_OUTPUT"
          elif [ -f "$PROJECT/contracts/scripts/publish.sh" ]; then
            echo "El commit anterior aún no tiene los scripts: se usan los de este commit, que los agrega."
            echo "dir=$GITHUB_WORKSPACE/$PROJECT" >> "$GITHUB_OUTPUT"
          else
            echo "$PROJECT no tiene contracts/scripts/publish.sh: no hay contratos que publicar."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Java para el Maven del proyecto, que corre openapi-diff.
      - if: steps.judge.outputs.enabled == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml

      # Q08 no es todavía un check obligatorio: se repite aquí para no publicar lo que no la cumple, también si dos
      # PR subieron la misma versión. La aprobación es la etiqueta del PR que se integró en este commit.
      - name: Etiqueta contrato-incompatible del PR integrado
        id: label
        if: steps.judge.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          approved=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
            --jq 'any(.[]; .merged_at != null and any(.labels[]; .name == "contrato-incompatible"))')
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

      - name: Contratos contra el commit anterior
        if: steps.judge.outputs.enabled == 'true'
        env:
          JUDGE: ${{ steps.judge.outputs.dir }}
          LIV_CONTRACTS_ROOT: ${{ github.workspace }}/${{ matrix.project }}
          LIV_CONTRACTS_BREAKING_APPROVED: ${{ steps.label.outputs.approved }}
        run: sh "$JUDGE/contracts/scripts/compare.sh" HEAD^1

      # Publica solo la versión que introduce este commit, o la de un contrato que nunca se publicó.
      - name: Publicar los contratos
        if: steps.judge.outputs.enabled == 'true'
        env:
          JUDGE: ${{ steps.judge.outputs.dir }}
          LIV_CONTRACTS_ROOT: ${{ github.workspace }}/${{ matrix.project }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh "$JUDGE/contracts/scripts/publish.sh" HEAD^1
