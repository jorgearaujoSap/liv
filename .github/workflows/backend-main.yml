# Publicación del backend al integrar en main (doc. 04 §9). Por ahora solo los contratos OpenAPI, como releases
# versionadas que descarga el frontend (plan de la feature 001, paso 6; ADR 0027), de la API (backend/) y del BFF
# (backend/bff/, desde que tenga su copia de los scripts en T18). La imagen, el SBOM, la firma y el despliegue a
# staging se agregan con sus tareas (T16 y el resto de F0‑07).
# publish.sh juzga cada versión nueva contra la release publicada más alta de su contrato antes de publicarla:
# como Q08 todavía no es un check obligatorio, así no se publica lo que no la cumple frente a lo ya publicado.
name: backend-main

on:
  push:
    branches: [main]
    paths:
      - 'backend/contracts/**'
      - 'backend/bff/contracts/**'
      - '.github/workflows/backend-main.yml'
  # Para volver a intentar la publicación de la punta de main, solo desde main. Como cada versión se juzga contra
  # lo publicado, también publica una versión que quedó pendiente de una integración anterior.
  workflow_dispatch:

permissions:
  contents: read

# Las publicaciones van en fila, sin cancelarse. GitHub deja una sola en espera: con tres integraciones seguidas,
# la del medio se cancela, y la siguiente publica la versión que quede en el árbol.
concurrency:
  group: backend-main
  cancel-in-progress: false

jobs:
  contracts:
    name: ${{ matrix.project }} · publicar contratos
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Crear las releases y sus etiquetas.
      contents: write
      # Leer las etiquetas del PR integrado.
      pull-requests: read
    strategy:
      fail-fast: false
      # Uno a la vez, para no competir por la misma fila de publicación.
      max-parallel: 1
      matrix:
        project: [backend, backend/bff]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      # Con fetch-depth 2 trae el commit anterior de main (squash e historia lineal), del que salen los scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Los scripts que juzgan y publican son los del commit anterior, como en backend-contracts-pr. Si aún no los
      # tiene (la integración que los agrega), los de este commit. Si hay contratos y no hay scripts, falla.
      - name: Scripts que juzgan y publican
        id: judge
        working-directory: .
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          if git cat-file -e "HEAD^1:$PROJECT/contracts/scripts/publish.sh" 2> /dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
            echo "dir=$RUNNER_TEMP/base/$PROJECT" >> "$GITHUB_OUTPUT"
          elif [ -f "$PROJECT/contracts/scripts/publish.sh" ]; then
            echo "El commit anterior aún no tiene los scripts: se usan los de este commit, que los agrega."
            echo "dir=$GITHUB_WORKSPACE/$PROJECT" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "HEAD:$PROJECT/contracts/openapi" 2> /dev/null; then
            echo "::error::$PROJECT tiene contratos pero no contracts/scripts/publish.sh."
            exit 1
          else
            echo "$PROJECT no tiene contratos que publicar."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Java para el Maven del proyecto, que corre openapi-diff.
      - if: steps.judge.outputs.enabled == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml

      # La aprobación de un cambio incompatible es la etiqueta del PR que se integró en este commit.
      - name: Etiqueta contrato-incompatible del PR integrado
        id: label
        if: steps.judge.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          approved=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
            --jq 'any(.[]; .merged_at != null and any(.labels[]; .name == "contrato-incompatible"))')
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

      - name: Juzgar contra lo publicado y publicar
        if: steps.judge.outputs.enabled == 'true'
        env:
          JUDGE: ${{ steps.judge.outputs.dir }}
          LIV_CONTRACTS_ROOT: ${{ github.workspace }}/${{ matrix.project }}
          LIV_CONTRACTS_BREAKING_APPROVED: ${{ steps.label.outputs.approved }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh "$JUDGE/contracts/scripts/publish.sh"
