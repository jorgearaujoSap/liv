# CI de PR del backend (doc. 04 §9, IN‑08): solo orquesta los comandos del proyecto, desde su carpeta.
# Compuertas cubiertas hoy: Q01 (compilación y formato), Q02 (pruebas) y Q03 (arquitectura). El resto
# (cobertura, mutación, seguridad, contrato) se agrega cuando existan sus herramientas (F0‑07).
# Corre en todos los PR, sin filtro de rutas: «backend · cambios» decide si «backend · verify» corre o se omite
# (.github/scripts/aplica.sh). Los nombres de los trabajos son los de los checks obligatorios del ruleset «main»:
# no se cambian sin cambiar también la protección, o el check obligatorio queda esperando para siempre.
name: backend-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decide si el PR toca algo que afecte al proyecto (.github/scripts/aplica.sh). Corre en todos los PR: así el
  # check «backend · verify» existe siempre y puede ser obligatorio. Usa el script de la rama base, no el del PR.
  cambios:
    name: backend · cambios
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      aplica: ${{ steps.aplica.outputs.aplica }}
    steps:
      # El checkout es el merge del PR con main; con fetch-depth 2 trae también su primer padre, la punta de main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: ¿Cambia el PR algo que afecte a backend?
        id: aplica
        run: |
          if git cat-file -e HEAD^1:.github/scripts/aplica.sh 2> /dev/null; then
            git show HEAD^1:.github/scripts/aplica.sh > "$RUNNER_TEMP/aplica.sh"
            bash "$RUNNER_TEMP/aplica.sh" backend >> "$GITHUB_OUTPUT"
          else
            echo "La base aún no tiene el script (el PR que lo agrega): aplica."
            echo "aplica=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: backend · verify
    needs: cambios
    if: ${{ always() && (needs.cambios.result != 'success' || needs.cambios.outputs.aplica != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # `sh` porque mvnw aún no tiene permiso de ejecución en Git; se corrige en el primer PR del backend.
      - name: Compilación, formato, arquitectura y pruebas (Q01–Q03)
        run: sh mvnw -B -ntp verify
