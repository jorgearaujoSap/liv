# CI de PR del frontend (doc. 04 §9, IN‑08): solo orquesta los scripts de npm del proyecto, desde su carpeta.
# Compuertas cubiertas hoy: Q01 (lint, formato y build) y Q02 (pruebas unitarias).
# Corre en todos los PR, sin filtro de rutas: «frontend · cambios» decide si «frontend · verify» corre o se omite
# (.github/scripts/aplica.sh). Los nombres de los trabajos son los de los checks obligatorios del ruleset «main»:
# no se cambian sin cambiar también la protección, o el check obligatorio queda esperando para siempre.
name: frontend-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decide si el PR toca algo que afecte al proyecto (.github/scripts/aplica.sh). Corre en todos los PR: así el
  # check «frontend · verify» existe siempre y puede ser obligatorio. Usa el script de la rama base, no el del PR.
  cambios:
    name: frontend · cambios
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      aplica: ${{ steps.aplica.outputs.aplica }}
    steps:
      # El checkout es el merge del PR con main; con fetch-depth 2 trae también su primer padre, la punta de main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: ¿Cambia el PR algo que afecte a frontend?
        id: aplica
        run: |
          if git cat-file -e HEAD^1:.github/scripts/aplica.sh 2> /dev/null; then
            git show HEAD^1:.github/scripts/aplica.sh > "$RUNNER_TEMP/aplica.sh"
            bash "$RUNNER_TEMP/aplica.sh" frontend >> "$GITHUB_OUTPUT"
          else
            echo "La base aún no tiene el script (el PR que lo agrega): aplica."
            echo "aplica=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: frontend · verify
    needs: cambios
    if: ${{ always() && (needs.cambios.result != 'success' || needs.cambios.outputs.aplica != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (versiones exactas del lock)
        run: npm ci

      - name: Lint (Q01)
        run: npm run lint

      - name: Formato (Q01)
        run: npm run format:check

      - name: Pruebas (Q02)
        run: npm test

      - name: Build (Q01)
        run: npm run build
