# Compuerta Q08 del backend (doc. 04 §8): los contratos OpenAPI no tienen cambios incompatibles sin aprobar
# (doc. 01 §10, ADR 0027). Solo orquesta los scripts de contracts/scripts/ de cada proyecto (IN‑08): la API
# (backend/) y el BFF (backend/bff/), que tiene su propia copia desde T18; mientras no la tenga, su trabajo no
# hace nada.
# Juzga el comparador de la base (la punta de main, con su pom.xml), no el del PR: un PR no puede cambiar la regla
# con la que se juzga. Los scripts del PR solo se prueban, en otro trabajo, con su test/run.sh, y rigen desde que
# se integran. El trabajo que juzga no ejecuta nada del PR ni restaura la caché de Maven, que el PR podría haber
# escrito. Límite: un pull_request corre este workflow tal como está en el PR, así que un mismo PR no puede cambiar
# a la vez este workflow y un contrato.
# Va aparte de backend-pr para que poner o quitar la etiqueta contrato-incompatible vuelva a correr solo esta
# comprobación y no el verify completo. La etiqueta es la aprobación del responsable; la pone una persona con
# permiso de escritura, nunca un agente.
# Corre en todos los PR, sin filtro de rutas: «backend · cambios» decide si el comparador y sus pruebas corren o se
# omiten (.github/scripts/aplica.sh, proyecto «contratos»). Un trabajo de matriz omitido publica su check con el nombre
# sin expandir, que nadie puede exigir; por eso «backend · contratos» es el agregado y el check obligatorio del ruleset
# «main». Los nombres de los trabajos son los de la protección: no se cambian sin cambiar también el ruleset.
name: backend-contracts-pr

on:
  pull_request:
    branches: [main]
    # edited: si el PR cambia de rama base, se vuelve a comparar.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: backend-contracts-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decide si el PR toca contratos, pom.xml o el wrapper de Maven (.github/scripts/aplica.sh). Corre en todos los PR:
  # así «backend · contratos» existe siempre y puede ser obligatorio. Usa el script de la rama base, no el del PR.
  cambios:
    name: backend · cambios
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      aplica: ${{ steps.aplica.outputs.aplica }}
    steps:
      # El checkout es el merge del PR con main; con fetch-depth 2 trae también su primer padre, la punta de main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: ¿Cambia el PR los contratos o el Maven del comparador?
        id: aplica
        run: |
          if git cat-file -e HEAD^1:.github/scripts/aplica.sh 2> /dev/null; then
            git show HEAD^1:.github/scripts/aplica.sh > "$RUNNER_TEMP/aplica.sh"
            bash "$RUNNER_TEMP/aplica.sh" contratos >> "$GITHUB_OUTPUT"
          else
            echo "La base aún no tiene el script (el PR que lo agrega): aplica."
            echo "aplica=true" >> "$GITHUB_OUTPUT"
          fi

  # Pruebas de los scripts tal como quedan en el PR. Van aparte del juez para que nada de lo que ejecutan llegue
  # al trabajo que compara.
  test:
    name: ${{ matrix.project }} · pruebas del comparador
    needs: cambios
    if: ${{ always() && (needs.cambios.result != 'success' || needs.cambios.outputs.aplica != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [backend, backend/bff]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Sin pruebas solo si el proyecto nunca las tuvo: quitarlas no apaga la compuerta en silencio.
      - name: ¿Tiene pruebas el comparador del proyecto?
        id: project
        working-directory: .
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          if [ -f "$PROJECT/contracts/scripts/test/run.sh" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "HEAD^1:$PROJECT/contracts/scripts/test/run.sh" 2> /dev/null; then
            echo "::error::El PR quita $PROJECT/contracts/scripts/test/run.sh: las pruebas del comparador no se quitan."
            exit 1
          else
            echo "$PROJECT no tiene comparador: no hay pruebas que correr."
          fi

      # Java para el Maven del proyecto, que corre openapi-diff.
      - if: steps.project.outputs.enabled == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml

      - name: Pruebas de los scripts del PR
        if: steps.project.outputs.enabled == 'true'
        run: sh contracts/scripts/test/run.sh

  compare:
    name: ${{ matrix.project }} · contratos (Q08)
    needs: cambios
    if: ${{ always() && (needs.cambios.result != 'success' || needs.cambios.outputs.aplica != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Leer las etiquetas del PR en vivo, no las del evento: volver a correr una ejecución vieja no recupera una
      # etiqueta que ya se quitó.
      issues: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        project: [backend, backend/bff]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      # El checkout es el merge del PR con main; con fetch-depth 2 trae también su primer padre, la punta de main
      # contra la que se compara.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: El PR no cambia a la vez los workflows de contratos y los contratos
        working-directory: .
        run: |
          cambios=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$cambios" | grep -Eq '^\.github/workflows/backend-(contracts-pr|main)\.yml$' &&
             printf '%s\n' "$cambios" | grep -Eq '^backend/(bff/)?contracts/'; then
            echo "::error::Un PR que cambia los workflows de contratos no cambia también los contratos ni sus scripts: van en PR separados."
            exit 1
          fi

      # Juez: el comparador de la base, en un worktree aparte. Si la base aún no lo tiene (el PR que lo agrega),
      # juzga el del PR. Si ninguno lo tiene pero hay contratos, falla: quitar los scripts no apaga la compuerta.
      - name: Comparador que juzga
        id: judge
        working-directory: .
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          if git cat-file -e "HEAD^1:$PROJECT/contracts/scripts/compare.sh" 2> /dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
            echo "dir=$RUNNER_TEMP/base/$PROJECT" >> "$GITHUB_OUTPUT"
          elif [ -f "$PROJECT/contracts/scripts/compare.sh" ]; then
            echo "La base aún no tiene comparador: juzga el del PR, que lo agrega."
            echo "dir=$GITHUB_WORKSPACE/$PROJECT" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "HEAD:$PROJECT/contracts/openapi" 2> /dev/null; then
            echo "::error::$PROJECT tiene contratos pero no contracts/scripts/compare.sh."
            exit 1
          else
            echo "$PROJECT no tiene contratos que comparar."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Java para el Maven de la base, que corre openapi-diff. Sin caché: el trabajo de pruebas del PR podría haberla
      # escrito.
      - if: steps.judge.outputs.enabled == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Etiqueta contrato-incompatible
        id: label
        if: steps.judge.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          approved=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels?per_page=100" \
            --jq 'any(.[]; .name == "contrato-incompatible")')
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

      - name: Contratos del PR contra main
        if: steps.judge.outputs.enabled == 'true'
        env:
          JUDGE: ${{ steps.judge.outputs.dir }}
          LIV_CONTRACTS_ROOT: ${{ github.workspace }}/${{ matrix.project }}
          LIV_CONTRACTS_BREAKING_APPROVED: ${{ steps.label.outputs.approved }}
        run: sh "$JUDGE/contracts/scripts/compare.sh" HEAD^1

  # El check obligatorio de los contratos (ruleset «main»). Corre siempre y aprueba solo en dos casos; cualquier otra
  # combinación (failure, cancelled, un resultado inesperado) lo deja en rojo.
  contratos:
    name: backend · contratos
    needs: [cambios, test, compare]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Resultado de los contratos
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          APLICA: ${{ needs.cambios.outputs.aplica }}
          TEST: ${{ needs.test.result }}
          COMPARE: ${{ needs.compare.result }}
        run: |
          if [ "$CAMBIOS" = success ] && [ "$APLICA" = false ] && [ "$TEST" = skipped ] && [ "$COMPARE" = skipped ]; then
            echo "El PR no cambia contratos, pom.xml ni wrapper de Maven: no hay nada que comparar."
          elif [ "$TEST" = success ] && [ "$COMPARE" = success ]; then
            echo "Las pruebas del comparador y los contratos pasaron."
          else
            echo "::error::Contratos sin aprobar (cambios: $CAMBIOS, pruebas: $TEST, comparación: $COMPARE)."
            exit 1
          fi
