# Publicación de liv-components al integrar en main (feature 002, ADR 0042, doc. 04 §9). Solo orquesta los scripts de
# ui/scripts/ (release-decide, release-notes, check-release --ci, release-publish): la lógica vive allí, con sus pruebas.
#
# ESTA VERSIÓN (R2) NO PUBLICA NADA: `publicar` solo ejecuta `npm publish --dry-run`. La publicación real y la etiqueta
# llegan en la R3, después de registrar el publicador de confianza en npm y de cambiar las reglas.
#
# Flujo: decidir (¿este commit subió la versión?) → verificar (lint, formato, pruebas, Storybook, empaquetado, notas) →
# publicar (entorno protegido `npm`, que espera la aprobación de una persona). Un cambio que no sube la versión termina
# en «decidir» con «nada»: no pide aprobación ni queda en espera detrás de otra ejecución (002-05).
#
# Tres controles contra la publicación desde otra rama (002-07), que valen aunque una rama cambie este archivo:
#   1. npm solo acepta este workflow con el entorno `npm` (publicador de confianza; se registra antes de la R3);
#   2. el entorno `npm` solo admite la rama main y pide la aprobación de sus revisores;
#   3. cada trabajo exige `github.ref == 'refs/heads/main'`.
# Los valores (versión, commit, hash, versiones de Node y npm) pasan solo por `env:`, nunca interpolados en `run:`.
# Aprobar o rechazar la publicación antes de integrar otra versión de la librería (spec.md › Diseño técnico).
name: ui-release

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-release.yml'
  # Para volver a evaluar la punta de main. También se limita a main: cada trabajo exige la rama.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decide qué hace la ejecución. No instala nada: lee el árbol de Git, npm y las etiquetas remotas, y sus scripts son
  # los que viajan a `publicar`. Sin `concurrency`, para que un cambio que no publica nunca quede en espera.
  decidir:
    name: ui-release · decidir
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      salida: ${{ steps.decide.outputs.salida }}
      nombre: ${{ steps.decide.outputs.nombre }}
      version: ${{ steps.decide.outputs.version }}
      commit: ${{ steps.decide.outputs.commit }}
      node: ${{ steps.decide.outputs.node }}
      npm: ${{ steps.decide.outputs.npm }}
    steps:
      # fetch-depth 2: release-decide compara la versión con la del commit padre (cada push a main es un commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Con `error` el script falla (rojo, con su mensaje); con `nada` termina en verde y los demás trabajos se omiten.
      - name: Decidir
        id: decide
        working-directory: ui
        run: node scripts/release-decide.mjs

      - name: Resumen
        if: ${{ !cancelled() }}
        env:
          SALIDA: ${{ steps.decide.outputs.salida }}
          MENSAJE: ${{ steps.decide.outputs.mensaje }}
        run: |
          {
            echo "### liv-components · decisión: \`${SALIDA:-sin decisión}\`"
            echo
            echo "${MENSAJE:-El script no escribió su decisión; revisa el registro del paso «Decidir».}"
            if [ "$SALIDA" = etiquetar ]; then
              echo
              echo "La etiqueta y la release las crea la R3 (feature 002); esta versión del workflow no las crea."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # El script de `publicar` viaja desde aquí, que no instaló nada, nunca desde `verificar`, que instala las
      # dependencias del proyecto (002-08). release-tag.mjs se agrega en la R3.
      - name: Subir los scripts de publicación
        if: ${{ steps.decide.outputs.salida == 'publicar' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scripts
          path: ui/scripts/release-publish.mjs
          if-no-files-found: error
          retention-days: 7

  # Instala las dependencias, verifica y empaqueta. Sin `id-token`: no puede publicar. Lo que construye es lo que se
  # publicará, así que el resumen enseña a quien aprueba el nombre, el commit, el SHA-256 y los archivos del .tgz.
  verificar:
    name: ui-release · verificar
    needs: decidir
    if: github.ref == 'refs/heads/main' && needs.decidir.outputs.salida == 'publicar'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.paquete.outputs.sha256 }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar que es el commit que decidió `decidir`
        env:
          COMMIT: ${{ needs.decidir.outputs.commit }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$COMMIT" ]; then
            echo "::error::El checkout está en $actual y decidir decidió sobre $COMMIT. Vuelve a ejecutar."
            exit 1
          fi

      # Sin caché: lo que se instala aquí termina dentro del paquete que se va a publicar.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc

      # Sin scripts de instalación de las dependencias (R1 lo comprobó en Windows; aquí, en ubuntu).
      - name: Instalar dependencias (versiones exactas del lock)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Pruebas de componentes y de scripts
        run: npm test

      - name: Catálogo de Storybook
        run: npm run build-storybook

      - name: Build y empaquetado
        run: npm run pack

      # Va después de `pack`: lee el package.json empaquetado del .tgz. Falla si falta la sección del CHANGELOG.md,
      # si la versión no es mayor que la publicada o si falta el campo repository.
      - name: Verificar la versión y el paquete
        run: npm run release:check -- --ci

      - name: Notas de la versión
        env:
          VERSION: ${{ needs.decidir.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" "$RUNNER_TEMP/notas.md"

      - name: Preparar el paquete y su resumen
        id: paquete
        env:
          NOMBRE: ${{ needs.decidir.outputs.nombre }}
          VERSION: ${{ needs.decidir.outputs.version }}
          COMMIT: ${{ needs.decidir.outputs.commit }}
        run: |
          archivo="$NOMBRE-$VERSION.tgz"
          salida="$RUNNER_TEMP/paquete"
          mkdir "$salida"
          cp "dist/$archivo" "$salida/$archivo"
          cp "$RUNNER_TEMP/notas.md" "$salida/notas.md"
          sha=$(sha256sum "$salida/$archivo" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$sha" "$archivo" > "$salida/$archivo.sha256"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Se va a publicar \`$NOMBRE@$VERSION\`"
            echo
            echo "- **Commit:** \`$COMMIT\`"
            echo "- **SHA-256 del .tgz:** \`$sha\`"
            echo
            echo "Archivos del .tgz (revísalos antes de aprobar):"
            echo
            echo '```text'
            tar -tvzf "$salida/$archivo"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el paquete
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquete
          path: ${{ runner.temp }}/paquete
          if-no-files-found: error
          retention-days: 7

  # Espera la aprobación del entorno `npm`. Es el único trabajo con `id-token: write`: no hace checkout, no instala las
  # dependencias del proyecto y no ejecuta nada que haya pasado por un trabajo que las instaló (002-08).
  publicar:
    name: ui-release · publicar (dry-run)
    needs: [decidir, verificar]
    if: github.ref == 'refs/heads/main' && needs.decidir.outputs.salida == 'publicar'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # La publicación de confianza (OIDC); en la R2 no se usa porque solo hay --dry-run.
      id-token: write
    # Una publicación a la vez, sin cancelar la que ya corre.
    concurrency:
      group: ui-release-publicar
      cancel-in-progress: false
    steps:
      # Versiones exactas que validó `decidir`, sin caché ni registry-url (el token OIDC lo maneja npm).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.decidir.outputs.node }}

      - name: Instalar la versión exacta de npm
        env:
          NPM_VERSION: ${{ needs.decidir.outputs.npm }}
        run: |
          npm install --global "npm@$NPM_VERSION"
          actual=$(npm --version)
          if [ "$actual" != "$NPM_VERSION" ]; then
            echo "::error::npm quedó en $actual y debía ser $NPM_VERSION."
            exit 1
          fi

      - name: Descargar los scripts de decidir
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-scripts
          path: ${{ runner.temp }}/scripts

      - name: Descargar el paquete de verificar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete
          path: ${{ runner.temp }}/paquete

      # El .tgz tiene que ser el que verificó `verificar`: el SHA-256 viaja por la salida del trabajo, aparte del
      # artefacto. El nombre y la versión salen de `decidir`.
      - name: Comprobar nombre, versión y SHA-256
        env:
          NOMBRE: ${{ needs.decidir.outputs.nombre }}
          VERSION: ${{ needs.decidir.outputs.version }}
          SHA256: ${{ needs.verificar.outputs.sha256 }}
        run: |
          if ! printf '%s' "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::verificar no entregó un SHA-256 válido."
            exit 1
          fi
          archivo="$NOMBRE-$VERSION.tgz"
          cd "$RUNNER_TEMP/paquete"
          if [ ! -f "$archivo" ]; then
            echo "::error::El artefacto no tiene $archivo."
            exit 1
          fi
          printf '%s  %s\n' "$SHA256" "$archivo" | sha256sum --check --strict

      # Solo --dry-run en la R2: el script comprueba la integridad contra npm y ejecuta `npm publish --dry-run`.
      - name: Publicar en seco (DRY-RUN)
        env:
          NOMBRE: ${{ needs.decidir.outputs.nombre }}
          VERSION: ${{ needs.decidir.outputs.version }}
        run: |
          node "$RUNNER_TEMP/scripts/release-publish.mjs" \
            "$RUNNER_TEMP/paquete/$NOMBRE-$VERSION.tgz" "$NOMBRE" "$VERSION" --dry-run

      - name: Resumen
        if: ${{ !cancelled() }}
        env:
          NOMBRE: ${{ needs.decidir.outputs.nombre }}
          VERSION: ${{ needs.decidir.outputs.version }}
          ESTADO: ${{ job.status }}
        run: |
          {
            echo "### DRY-RUN: no publica"
            echo
            echo "Se probó la publicación de \`$NOMBRE@$VERSION\` con \`npm publish --dry-run\`. Resultado: \`$ESTADO\`."
            echo "Esta versión del workflow no publica en npm ni crea etiquetas (feature 002, R2)."
          } >> "$GITHUB_STEP_SUMMARY"
