# CI de PR de la librería liv-components (doc. 04 §9, IN‑08): solo orquesta los scripts de npm del proyecto.
# Compuertas cubiertas hoy: Q01 (lint, formato y empaquetado). Pruebas, historias, regresión visual y
# accesibilidad (Q02, Q14) se agregan con el primer componente (tarea T03 de la feature 001).
# Este workflow nunca publica en npm: solo un humano publica (AGENTS.md §4.5). Si el PR sube la versión de la librería,
# corre además `release:check --ci` (feature 002, 002-10).
# Corre en todos los PR, sin filtro de rutas: «ui · cambios» decide si «ui · verify» corre o se omite
# (.github/scripts/aplica.sh). Los nombres de los trabajos son los de los checks obligatorios del ruleset «main»:
# no se cambian sin cambiar también la protección, o el check obligatorio queda esperando para siempre.
name: ui-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decide si el PR toca algo que afecte al proyecto (.github/scripts/aplica.sh). Corre en todos los PR: así el
  # check «ui · verify» existe siempre y puede ser obligatorio. Usa el script de la rama base, no el del PR.
  cambios:
    name: ui · cambios
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      aplica: ${{ steps.aplica.outputs.aplica }}
    steps:
      # El checkout es el merge del PR con main; con fetch-depth 2 trae también su primer padre, la punta de main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: ¿Cambia el PR algo que afecte a ui?
        id: aplica
        run: |
          if git cat-file -e HEAD^1:.github/scripts/aplica.sh 2> /dev/null; then
            git show HEAD^1:.github/scripts/aplica.sh > "$RUNNER_TEMP/aplica.sh"
            bash "$RUNNER_TEMP/aplica.sh" ui >> "$GITHUB_OUTPUT"
          else
            echo "La base aún no tiene el script (el PR que lo agrega): aplica."
            echo "aplica=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: ui · verify
    needs: cambios
    if: ${{ always() && (needs.cambios.result != 'success' || needs.cambios.outputs.aplica != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      # fetch-depth 2: trae también el primer padre del merge (la punta de main), para saber si el PR sube la versión.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Instalar dependencias (versiones exactas del lock)
        run: npm ci

      - name: Lint (Q01)
        run: npm run lint

      - name: Formato (Q01)
        run: npm run format:check

      - name: Pruebas de componentes con accesibilidad (Q02, Q14)
        run: npm test

      - name: Catálogo de Storybook (Q14)
        run: npm run build-storybook

      - name: Build y empaquetado (Q01)
        run: npm run pack

      # 002-10: un PR que sube la versión de la librería se juzga aquí, antes de llegar a main, con las mismas
      # verificaciones de publicación que ui-release.yml. Sin versión nueva no corre (la versión ya publicada
      # haría fallar la verificación). Si no se puede leer alguna de las dos versiones, corre: ante la duda se verifica.
      - name: ¿Sube el PR la versión de la librería?
        id: version
        working-directory: .
        run: |
          manifest=ui/projects/liv-components/package.json
          leer() { node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).version)'; }
          nueva=$(leer < "$manifest" 2> /dev/null) || nueva=
          base=$(git show "HEAD^1:$manifest" 2> /dev/null | leer 2> /dev/null) || base=
          if [ -n "$nueva" ] && [ "$nueva" = "$base" ]; then
            echo "La versión no cambia: no se verifica la publicación."
            echo "cambia=false" >> "$GITHUB_OUTPUT"
          else
            echo "El PR cambia la versión de la librería (de '${base:-ninguna}' a '${nueva:-ilegible}'): se verifica la publicación."
            echo "cambia=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar la publicación (002-10)
        if: ${{ steps.version.outputs.cambia == 'true' }}
        run: npm run release:check -- --ci
