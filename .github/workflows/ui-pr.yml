# CI de PR de la librería liv-components (doc. 04 §9, IN‑08): solo orquesta los scripts de npm del proyecto.
# Compuertas cubiertas hoy: Q01 (lint, formato y empaquetado). Pruebas, historias, regresión visual y
# accesibilidad (Q02, Q14) se agregan con el primer componente (tarea T03 de la feature 001).
# Este workflow nunca publica en npm: solo un humano publica (AGENTS.md §4.5).
name: ui-pr

on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-pr.yml'

permissions:
  contents: read

concurrency:
  group: ui-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: ui · verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Instalar dependencias (versiones exactas del lock)
        run: npm ci

      - name: Lint (Q01)
        run: npm run lint

      - name: Formato (Q01)
        run: npm run format:check

      - name: Build y empaquetado (Q01)
        run: npm run pack
