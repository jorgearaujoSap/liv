# Actualizaciones de dependencias (doc. 02 §11). Un PR de Dependabot que suba una versión mayor
# exige ADR antes de integrarse (AGENTS.md §4.5); los parches y menores se revisan como cualquier PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(backend)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(frontend)

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(ui)
