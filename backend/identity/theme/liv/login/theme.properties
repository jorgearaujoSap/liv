# Tema liv de las páginas de acceso (ADR 0024, tarea T08 de la feature 001). Hereda de base, sin PatternFly:
# las plantillas propias y styles/liv.css dan todo el aspecto. El realm lo activa con loginTheme: liv.
parent=base
locales=es
# La genera Tailwind al construir la imagen (Dockerfile, npm run build).
styles=css/liv.css

# Clases para las páginas de Keycloak que el tema no redefine (las de base usan estas propiedades).
kcFormGroupClass=liv-form-group
kcLabelClass=liv-label
kcInputClass=liv-input
kcButtonClass=liv-button
kcButtonPrimaryClass=liv-button--primary
kcButtonDefaultClass=liv-button--secondary
