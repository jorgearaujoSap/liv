spring:
  application:
    name: liv-api
  threads:
    virtual:
      enabled: true
  # El ejecutor de Spring Boot sigue siendo el de @Async por omisión aunque la auditoría tenga el suyo (T15).
  task:
    execution:
      mode: force
  # La aplicación se conecta siempre como liv_app (sujeto a RLS; nunca como liv_owner). La URL y la contraseña
  # llegan por variables de entorno y no tienen valor por defecto (sin LIV_DB_URL no arranca; sin la contraseña no
  # se autentica). Si el despliegue cambia el usuario, ninguna conexión pasa la comprobación de liv_app (abajo) y la
  # instancia no queda lista (readiness).
  datasource:
    url: ${LIV_DB_URL}
    username: liv_app
    password: ${LIV_APP_PASSWORD}
    # Cada petición a /api consulta el registro de usuarios: si la base no responde, 503 a los 5 s en lugar de
    # esperar los 30 s por omisión.
    hikari:
      connection-timeout: 5000
      # Cada conexión nueva comprueba que el rol sea liv_app sin forma de saltarse la RLS: lo impone el código
      # (platform.persistence.LivAppConnectionCheck), así que ninguna propiedad lo quita (T12).
  # JPA sin consultar la base al arrancar (la API arranca aunque la base no esté arriba). El gestor de transacciones
  # fija el contexto RLS en cada transacción (platform.persistence).
  jpa:
    open-in-view: false
    # Como Hibernate no lee los metadatos de la base, el dialecto se indica aquí. Hibernate avisa que sobra porque
    # supone que puede detectarlo; sin él, el arranque falla.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      # No abrir una conexión al arrancar para leer los metadatos JDBC.
      hibernate.boot.allow_jdbc_metadata_access: false
  # Flyway (liv_owner) corre solo en los perfiles dev y test. En staging y producción migra la imagen
  # liv-migrations como paso del despliegue.
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  # El BFF envía Authorization y, al iniciar sesión, X-User-Token de hasta 8.192 caracteres
  # (core-internal.yaml): el valor por omisión (8 KB para todas las cabeceras) no alcanza.
  max-http-request-header-size: 32KB

# Validación de tokens solo por propiedades (plan, paso 7): el emisor se descubre con OIDC, así
# que sirve cualquier proveedor estándar (001-20). LIV_OIDC_ISSUER_URI no tiene valor por defecto:
# sin emisor no se acepta ningún token.
liv:
  # Alta automática en el primer ingreso (001-21). Se apaga, por ejemplo, durante un cambio de proveedor de
  # identidad: un usuario desconocido recibe 403 (001-17) y se vincula de forma explícita (decisión de T13).
  sessions:
    auto-provision: true
  # Reentrega de los eventos del outbox cuyo oyente falló o no terminó: cada 5 minutos, los de más de 5 minutos
  # (los más recientes pueden estar en curso), una réplica a la vez (ShedLock).
  outbox:
    resubmission-interval: PT5M
    resubmit-older-than: PT5M
  # Auditoría (001-18, T15). La clave del HMAC enmascara el usuario intentado y el autor de los cambios del
  # proveedor; no tiene valor por defecto. El importador copia los eventos del proveedor con el cliente
  # liv-audit-importer (client credentials) cada minuto, uno a la vez entre réplicas (ShedLock).
  audit:
    hmac-key: ${LIV_AUDIT_HMAC_KEY:}
    # Oyentes de los eventos de LIV: pocos a la vez, para no quitar conexiones a las peticiones (pool de 10).
    listener-threads: 4
    listener-queue: 10000
    importer:
      enabled: true
      # API de administración del realm, por ejemplo en la red interna; vacío: la del emisor (/admin/realms/...).
      admin-base-uri: ${LIV_IDP_ADMIN_BASE_URI:}
      client-id: liv-audit-importer
      client-secret: ${LIV_AUDIT_IMPORTER_SECRET:}
      interval: PT1M
      initial-delay: PT1M
      # La consulta se superpone con la anterior (eventos que el proveedor guarda tarde) y se alerta si la marca
      # de agua se atrasa más de un día: Keycloak los borra a los 30 días (eventsExpiration).
      overlap: PT5M
      max-lag: P1D
      retention: P30D
      page-size: 100
      max-pages: 20
  security:
    issuer-uri: ${LIV_OIDC_ISSUER_URI}
    user-audience: liv-api
    # Los usuarios solo inician sesión por el BFF (plan, ajustes de T12).
    user-client-id: liv-bff
    service-audience: liv-internal
    service-client-id: liv-bff-service
    claims:
      administration-id: administration_id
      roles: roles

# Outbox de Spring Modulith en JDBC (T15): la tabla platform.event_publication la crea Flyway, no Modulith. Los
# eventos sin completar no se reentregan al arrancar (eso exige la base para arrancar, ajustes de T12): los
# reentrega un trabajo programado de platform (liv.outbox).
spring.modulith.events:
  jdbc:
    schema: platform
    schema-initialization:
      enabled: false
  republish-outstanding-events-on-restart: false
  # Cada entrega completada se borra (decisión del responsable, T15; migración V202611031000): la tabla no guarda
  # los eventos para siempre.
  completion-mode: delete
  # Una entrega que se quedó en curso (la instancia cayó con el oyente a medias) pasa a fallida y la reentrega
  # programada la toma.
  staleness:
    published: PT10M
    processing: PT10M
    resubmitted: PT10M
    check-interval: PT1M

# Cada línea de log lleva el id de correlación de la petición (doc. 02 §9, CorrelationIdFilter).
logging:
  pattern:
    correlation: "[%X{correlation_id:-}] "
  # Trazas de excepción con las credenciales enmascaradas (logback-spring.xml).
  exception-conversion-word: "%maskedEx"
  level:
    # En DEBUG, Spring MVC registra el toString de los modelos generados, que tiene datos personales (T11).
    org.springframework.web: INFO

management:
  # Sondas de liveness y readiness; readiness incluye la base (con el rol equivocado no hay conexión), así que una
  # instancia mal configurada nunca recibe tráfico (T12).
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,modulith
