spring:
  application:
    name: liv-api
  threads:
    virtual:
      enabled: true
  # La aplicación se conecta siempre como liv_app (sujeto a RLS; nunca como liv_owner). La URL y la contraseña
  # llegan por variables de entorno y no tienen valor por defecto (sin LIV_DB_URL no arranca; sin la contraseña no
  # se autentica). El despliegue no debe sobrescribir el usuario; la comprobación al arrancar llega con el gestor
  # de transacciones (T12, segunda parte).
  datasource:
    url: ${LIV_DB_URL}
    username: liv_app
    password: ${LIV_APP_PASSWORD}
    # Cada petición a /api consulta el registro de usuarios: si la base no responde, 503 a los 5 s en lugar de
    # esperar los 30 s por omisión.
    hikari:
      connection-timeout: 5000
      # Cada conexión nueva comprueba que el rol sea liv_app y no salte la RLS: si el despliegue cambia el usuario
      # (p. ej. SPRING_DATASOURCE_USERNAME), no se obtiene ninguna conexión y el error dice por qué (T12). El CAST
      # de un texto a boolean es a propósito: falla, y PostgreSQL devuelve ese texto en el mensaje de error.
      connection-init-sql: >-
        SELECT CASE WHEN current_user = 'liv_app' AND NOT r.rolbypassrls THEN true
        ELSE CAST('LIV solo se conecta como liv_app sin BYPASSRLS, no como ' || current_user AS boolean) END
        FROM pg_roles r WHERE r.rolname = current_user
  # JPA sin consultar la base al arrancar (la API arranca aunque la base no esté arriba). El gestor de transacciones
  # fija el contexto RLS en cada transacción (platform.persistence).
  jpa:
    open-in-view: false
    # Como Hibernate no lee los metadatos de la base, el dialecto se indica aquí. Hibernate avisa que sobra porque
    # supone que puede detectarlo; sin él, el arranque falla.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      # No abrir una conexión al arrancar para leer los metadatos JDBC.
      hibernate.boot.allow_jdbc_metadata_access: false
  # Tabla del outbox en el esquema platform (V202611010900); la usa el starter JDBC de Spring Modulith.
  modulith:
    events:
      jdbc:
        schema: platform
  # Flyway (liv_owner) corre solo en los perfiles dev y test. En staging y producción migra la imagen
  # liv-migrations como paso del despliegue.
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  # El BFF envía Authorization y, al iniciar sesión, X-User-Token de hasta 8.192 caracteres
  # (core-internal.yaml): el valor por omisión (8 KB para todas las cabeceras) no alcanza.
  max-http-request-header-size: 32KB

# Validación de tokens solo por propiedades (plan, paso 7): el emisor se descubre con OIDC, así
# que sirve cualquier proveedor estándar (001-20). LIV_OIDC_ISSUER_URI no tiene valor por defecto:
# sin emisor no se acepta ningún token.
liv:
  security:
    issuer-uri: ${LIV_OIDC_ISSUER_URI}
    user-audience: liv-api
    # Los usuarios solo inician sesión por el BFF (plan, ajustes de T12).
    user-client-id: liv-bff
    service-audience: liv-internal
    service-client-id: liv-bff-service
    claims:
      administration-id: administration_id
      roles: roles

# Cada línea de log lleva el id de correlación de la petición (doc. 02 §9, CorrelationIdFilter).
logging:
  pattern:
    correlation: "[%X{correlation_id:-}] "
  # Trazas de excepción con las credenciales enmascaradas (logback-spring.xml).
  exception-conversion-word: "%maskedEx"
  level:
    # En DEBUG, Spring MVC registra el toString de los modelos generados, que tiene datos personales (T11).
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
