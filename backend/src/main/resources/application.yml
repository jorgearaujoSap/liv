spring:
  application:
    name: liv-api
  threads:
    virtual:
      enabled: true
  # La aplicación se conecta como liv_app (sujeto a RLS). Credenciales solo por variables de entorno.
  datasource:
    url: ${LIV_DB_URL:jdbc:postgresql://localhost:5433/liv}
    username: ${LIV_DB_USER:liv_app}
    password: ${LIV_APP_PASSWORD:}
  # Flyway (liv_owner) corre solo en los perfiles dev y test. En staging y producción migra la imagen
  # liv-migrations como paso del despliegue.
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
