# Catálogo del menú de LIV (feature 001, criterio 001-15).
#
# - Opciones y orden: mapa del menú de Doc. 01 §3.
# - Permisos: matriz aprobada en H2 (plan de la feature 001, «Permisos»). Quién tiene cada permiso
#   está en platform.role_permission, no aquí.
# - Una hoja lleva su permiso y su estado:
#   - AVAILABLE: navega;
#   - COMING_SOON: se muestra deshabilitada hasta que su feature la construya.
# - Una rama no lleva ni permiso ni estado: se ve si se ve alguno de sus hijos, y está disponible si
#   alguno de sus hijos visibles lo está.
# - Los módulos 2 a 9 son hojas hasta que tengan matriz por opción.
# - "Inicio" no está aquí porque no exige permiso.
# - Profundidad, estados y reparto de 1.5: plan de la feature 001, «Decisiones», ajustes de T14.
