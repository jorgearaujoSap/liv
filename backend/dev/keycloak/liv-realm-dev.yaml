# Capa SOLO DE DESARROLLO del realm liv (tarea T07 de la feature 001). Vive en backend/dev, fuera de
# identity/config, para que ninguna imagen ni despliegue la copie; RealmConfigTest lo comprueba.
# keycloak-config-cli la aplica después de la base y solo cambia lo que este archivo declara.
# Datos ficticios. Contraseña de todos: Liv-Dev-2026!
# Sin credenciales TOTP: los usuarios con rol de MFA lo configuran en su primer ingreso, como en producción
# (001-06). keycloak-config-cli no actualiza credenciales TOTP sin duplicarlas al reaplicar; los usuarios con
# TOTP conocido para las pruebas e2e van en infra/ (tarea T23).
# administration_id usa los UUID de la semilla backend/dev/seed/R__core_dev_seed.sql.
realm: liv
# En el equipo de desarrollo Keycloak se usa por http://localhost; la base exige HTTPS siempre.
sslRequired: external
users:
  - username: dev.admin.sistema
    enabled: true
    email: dev.admin.sistema@example.test
    firstName: Laura
    lastName: Martínez Prueba
    attributes: { administration_id: ["10000000-0000-0000-0000-000000052356"] }
    realmRoles: [ADMIN_SISTEMA]
    credentials:
      - { type: password, value: "Liv-Dev-2026!", temporary: false }
