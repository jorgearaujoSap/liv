# Entorno local del backend (doc. 03 §4.2; tarea T09 de la feature 001).
# Solo para desarrollo: las contraseñas vienen de .env (copia de .env.example) y son ficticias.
# Uso, desde backend/:  docker compose -f dev/compose.yaml up -d   y luego   sh dev/check.sh
name: liv-backend-dev

services:
  postgres:
    # Fijado por digest (doc. 03 §4.1: nunca etiquetas móviles). PostgreSQL 18 o superior usa /var/lib/postgresql.
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia dev/.env.example a dev/.env}
      LIV_OWNER_PASSWORD: ${LIV_OWNER_PASSWORD:?}
      LIV_APP_PASSWORD: ${LIV_APP_PASSWORD:?}
      LIV_BFF_OWNER_PASSWORD: ${LIV_BFF_OWNER_PASSWORD:?}
      LIV_BFF_PASSWORD: ${LIV_BFF_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Roles y bases; solo corre al crear el volumen por primera vez.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: el servidor temporal de la inicialización solo escucha por socket, así que no da sano antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d liv"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    # Imagen de LIV: Keycloak 26.8.1 con el tema liv (identity/Dockerfile, tarea T08). Base de datos propia
    # (doc. 03 §5). Después de cambiar el tema:  docker compose -f dev/compose.yaml --env-file dev/.env up -d --build keycloak
    build: ../identity
    image: liv-identity-keycloak:dev
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
    # Para el cierre por canal trasero: Keycloak llama al BFF que corre en el equipo (LIV_BFF_BACKCHANNEL_URL).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9100}:9000"
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready por el puerto de gestión con bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy

  keycloak-config:
    # Aplica el realm liv como código (ADR 0024, tarea T07): la configuración base de todos los entornos y,
    # solo aquí, la capa de desarrollo con usuarios ficticios (dev/keycloak). Termina al aplicar. Reaplicar
    # es seguro y es también la forma de recuperarse si una aplicación falló a mitad. Para repetir:
    #   docker compose -f dev/compose.yaml --env-file dev/.env up -d --force-recreate keycloak-config
    # keycloak-config-cli 6.5.1, compilado para Keycloak 26.5.5; compatible con 26.8.1 (verificado en T07).
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN_USER:?}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Espera a que la API de administración responda antes de aplicar.
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/base/liv-realm.yaml,/config/dev/liv-realm-dev.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      LIV_BFF_BASE_URL: ${LIV_BFF_BASE_URL:?}
      LIV_BFF_BACKCHANNEL_URL: ${LIV_BFF_BACKCHANNEL_URL:?}
      LIV_BFF_CLIENT_SECRET: ${LIV_BFF_CLIENT_SECRET:?}
      LIV_BFF_SERVICE_CLIENT_SECRET: ${LIV_BFF_SERVICE_CLIENT_SECRET:?}
      LIV_AUDIT_IMPORTER_SECRET: ${LIV_AUDIT_IMPORTER_SECRET:?}
    volumes:
      - ../identity/config/base:/config/base:ro
      - ./keycloak:/config/dev:ro
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  postgres-data:
