# Entorno local del backend (doc. 03 §4.2; tarea T09 de la feature 001).
# Solo para desarrollo: las contraseñas vienen de .env (copia de .env.example) y son ficticias.
# Uso, desde backend/:  docker compose -f dev/compose.yaml up -d   y luego   sh dev/check.sh
name: liv-backend-dev

services:
  postgres:
    # Fijado por digest (doc. 03 §4.1: nunca etiquetas móviles). PostgreSQL 18 o superior usa /var/lib/postgresql.
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia dev/.env.example a dev/.env}
      LIV_OWNER_PASSWORD: ${LIV_OWNER_PASSWORD:?}
      LIV_APP_PASSWORD: ${LIV_APP_PASSWORD:?}
      LIV_BFF_OWNER_PASSWORD: ${LIV_BFF_OWNER_PASSWORD:?}
      LIV_BFF_PASSWORD: ${LIV_BFF_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Roles y bases; solo corre al crear el volumen por primera vez.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: el servidor temporal de la inicialización solo escucha por socket, así que no da sano antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d liv"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    # Keycloak 26.8.1, fijado por digest. Base de datos propia (doc. 03 §5).
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9100}:9000"
    volumes:
      # Punto de montaje del realm de desarrollo; lo llena la tarea T07 (backend/identity).
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
