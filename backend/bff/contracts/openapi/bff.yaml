openapi: 3.0.3
info:
  title: LIV · BFF
  version: 1.3.0
  description: >-
    Rutas propias del BFF que usa el navegador (ADR 0010, ADR 0005): inicio y cierre de sesión y
    estado de la sesión. Contract-first: el BFF se escribe contra este archivo y el frontend usa una
    copia fijada en frontend/api-spec/. No incluye /api/** (el contrato de la API: core.yaml y
    platform.yaml), que el BFF reenvía con el token de la sesión, ni /internal/**, que nunca se
    publica. En /api/** el propio BFF responde, sin cuerpo, 401 (sin sesión, o la sesión terminó) y
    502 (entre otros casos: el proveedor no renovó el token y el que había ya venció). El
    frontend trata todo 502 como un error que se puede reintentar. El navegador nunca recibe un token: la única cookie que autentica es LIV_SESSION
    (HttpOnly, Secure, SameSite=Strict). Toda petición que modifica datos, incluidas las de este
    contrato, lleva el token anti-CSRF: el frontend copia la cookie XSRF-TOKEN a la cabecera
    X-XSRF-TOKEN; sin él, el BFF responde 403 con code 001-12, también en /api/**, donde la petición
    no llega a la API. Ese rechazo va antes que el 401: una mutación sin el token recibe 403 aunque no
    haya sesión. Cualquier otro 403 de /api/** viene de la API. El BFF limita las peticiones por
    persona, por dirección y del inicio de sesión: pasado el límite responde 429 con Retry-After, también
    en /api/**, donde la petición no llega a la API. Feature 001 · Inicio de sesión.
tags:
  - name: Session
    description: Inicio y cierre de sesión y estado de la sesión.
  - name: Provider
    description: >-
      Rutas que llama el proveedor de identidad, no el navegador. Solo por la red interna: no se
      publican en internet.
paths:
  /bff/login:
    get:
      tags: [Session]
      operationId: login
      summary: Inicia el inicio de sesión (001-01).
      description: >-
        Se navega a esta ruta (navegación completa, no una petición del frontend). Redirige al
        proveedor de identidad con código y PKCE; el proveedor siempre pide las credenciales
        (prompt=login). Al volver, el BFF abre la sesión y redirige a returnTo. Si ya había una
        sesión abierta, la cierra antes. Si el proveedor o LIV no aceptan el inicio, la persona
        vuelve a esta misma ruta, sin ningún motivo en la URL.
      parameters:
        - name: returnTo
          in: query
          required: false
          description: >-
            Ruta de LIV a la que volver tras autenticarse. Solo se acepta una ruta propia (empieza
            por una sola /, sin // ni \, ni rutas del BFF); cualquier otro valor se cambia por /.
          schema:
            type: string
            maxLength: 2048
      responses:
        '302':
          description: Redirección al proveedor de identidad.
          headers:
            Location:
              description: Dirección de autorización del proveedor.
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /bff/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Cierra la sesión (001-09).
      description: >-
        Avisa a LIV (EndSession), revoca el refresh token en el proveedor, lo que cierra la sesión
        de la persona allí, y borra la sesión del BFF. Cada paso sigue si el anterior falla. Sin
        sesión responde igual. El frontend navega por completo a la ruta que responde.
      responses:
        '200':
          description: Sesión cerrada.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /bff/backchannel-logout:
    post:
      tags: [Provider]
      operationId: backchannelLogout
      summary: El proveedor cierra una sesión por el canal trasero (001-09).
      description: >-
        OpenID Connect Back-Channel Logout 1.0. Lo llama el proveedor de identidad cuando una sesión
        termina allí (la cierra un administrador, se desactiva a la persona o cambian sus permisos),
        por la red interna; el navegador no la usa. Sin cookie de sesión ni token anti-CSRF: el
        logout token, firmado por el proveedor, es la prueba. Debe traer sid, el evento del
        estándar, jti y ningún nonce, para el cliente del inicio de sesión y emitido hace menos de 2
        minutos. Termina con PROVIDER las sesiones del BFF de ese sid.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
                  description: >-
                    JWT firmado por el proveedor (typ logout+jwt o JWT, RS256). El cuerpo entero no
                    pasa de 16 KB.
      responses:
        '200':
          description: Las sesiones de ese sid terminaron, o no había ninguna.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store.
        '400':
          description: El logout token falta o no es válido.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackchannelLogoutError'
        '503':
          description: >-
            No se pudo terminar en este momento: no se leyeron las claves del proveedor, una sesión
            siguió bloqueada más de 5 segundos, falló la base o llegaron demasiados a la vez. La
            sesión del BFF sigue abierta: el proveedor debe volver a enviarlo.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store.
  /bff/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Cuánto le queda a la sesión (001-22, 001-10).
      description: >-
        Lee la sesión sin extenderla: preguntar no la mantiene viva. No lleva datos de la persona
        (esos los da /api/v1/me).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: La sesión está abierta.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401':
          description: >-
            No hay una sesión abierta: no existe, venció por inactividad o llegó a su duración
            máxima.
  /bff/session/keepalive:
    post:
      tags: [Session]
      operationId: keepAliveSession
      summary: La persona elige seguir conectada (001-22).
      description: >-
        Renueva siempre el token de acceso, aunque no esté por vencer, así que el proveedor de
        identidad también reinicia su inactividad, y extiende la sesión. No pasa de la duración
        máxima. Si el proveedor rechaza la renovación (usuario desactivado o sesión cerrada allí),
        la sesión termina y responde 401.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sesión extendida; lo que queda.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401':
          description: No hay una sesión abierta, llegó a su duración máxima o no se pudo renovar.
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: >-
            El proveedor de identidad no respondió a la renovación. La sesión sigue abierta: se
            puede intentar de nuevo.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: LIV_SESSION
      description: >-
        Cookie de sesión del BFF (HttpOnly, Secure, SameSite=Strict). No contiene ningún token.
  responses:
    CsrfRejected:
      description: >-
        Falta el token anti-CSRF o no es el de la cookie XSRF-TOKEN (001-12). Lo responde el BFF,
        también en /api/**, siempre con code 001-12 y en UTF-8.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CsrfProblem'
    TooManyRequests:
      description: >-
        Pasó el límite de peticiones de la persona, de la dirección o del inicio de sesión. Vuelve a
        intentarlo después de Retry-After segundos.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Segundos que faltan para poder volver a intentarlo.
        Cache-Control:
          schema:
            type: string
          description: no-store.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsProblem'
  schemas:
    SessionStatus:
      type: object
      required: [idleSecondsLeft, absoluteSecondsLeft]
      properties:
        idleSecondsLeft:
          type: integer
          format: int64
          minimum: 0
          description: Segundos que faltan para que venza por inactividad (15 minutos sin actividad).
        absoluteSecondsLeft:
          type: integer
          format: int64
          minimum: 0
          description: Segundos que faltan para su duración máxima (8 horas), haya o no actividad.
    LogoutResult:
      type: object
      required: [redirectTo]
      properties:
        redirectTo:
          type: string
          description: Ruta de LIV a la que navegar para iniciar sesión de nuevo (/bff/login).
    BackchannelLogoutError:
      type: object
      description: Error del cierre por canal trasero (OpenID Connect Back-Channel Logout 1.0, §2.8).
      required: [error]
      properties:
        error:
          type: string
          description: Siempre invalid_request.
          example: invalid_request
        error_description:
          type: string
          description: Qué falló, sin decir si el sid existe.
    TooManyRequestsProblem:
      type: object
      description: Rechazo por el límite de peticiones, en formato Problem Details (RFC 9457).
      required: [status, title]
      properties:
        status:
          type: integer
          format: int32
        title:
          type: string
    CsrfProblem:
      type: object
      description: Rechazo anti-CSRF del BFF (001-12), en formato Problem Details (RFC 9457).
      required: [status, code]
      properties:
        status:
          type: integer
          format: int32
        # No va como enum: openapi-diff 2.1.7 toma como incompatible agregar uno a una respuesta (ADR
        # 0027). BffContractTest comprueba que el ejemplo es el código que escribe el BFF.
        code:
          type: string
          description: Siempre 001-12.
          maxLength: 32
          example: '001-12'
