# Perfil de pruebas: Flyway corre con el dueño del esquema (liv_bff_owner) y la aplicación usa liv_bff. Las URL
# y las contraseñas las fija cada prueba con el contenedor de PostgreSQL.
spring:
  # Cada contexto de pruebas abre su propio pool: con 10 conexiones cada uno, la docena de contextos distintos
  # agota las 100 del servidor de pruebas.
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  flyway:
    enabled: true
    user: liv_bff_owner

# Valores de relleno para que el BFF arranque en las pruebas que no usan el proveedor ni la API: el proveedor se
# lee la primera vez que se necesita, no al arrancar. Las pruebas del flujo los reemplazan (BffFlowTest).
liv:
  bff:
    oidc:
      issuer-uri: http://localhost:1/sin-proveedor
      allow-http-issuer: true
      client-secret: relleno-de-prueba
      service-client-secret: relleno-de-prueba
    api:
      base-url: http://localhost:1
    session:
      encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
