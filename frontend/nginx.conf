# Servidor de estáticos del frontend (feature 001, T21; doc. 01 §2, doc. 02 §8 y doc. 03 §4.1).
# Se copia como /etc/nginx/conf.d/default.conf de la imagen nginx-unprivileged (ver Dockerfile), que lo
# incluye dentro de `http`. El frontend solo sirve la aplicación: la API y el BFF los enruta quien está
# delante (Caddy en e2e, el balanceador en AWS), que también termina TLS.
#
# Las cabeceras de seguridad se declaran SOLO en el bloque `server` y nunca dentro de un `location` ni de
# un `if`: nginx descarta las del `server` en cuanto un bloque interior declara una cabecera propia.
# scripts/nginx-conf.test.mjs lo comprueba.

# Qué caché lleva cada archivo. Angular pone un hash en el nombre de los archivos que compila
# (main-ON6NZC24.js, styles-ELR7ATZQ.css): esos nunca cambian y se guardan un año. Todo lo demás,
# empezando por index.html, no se guarda: así la sesión que terminó no queda en la caché del navegador y
# «atrás» tras salir no muestra datos (001-09).
map $uri $cache_control {
    default                          "no-store";
    "~-[A-Z0-9]{8}\.(js|css)$"       "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de doc. 02 §8.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Política de contenido (CSP):
    # - sin scripts de otros sitios, sin unsafe-inline ni unsafe-eval en script-src;
    # - script-src-attr admite un solo manejador en línea, por su hash: el onload="this.media='all'" con el
    #   que Angular carga la hoja de estilos (sha256 de «this.media='all'»);
    # - style-src admite unsafe-inline porque Angular crea elementos <style> al ejecutarse y el CSS
    #   crítico se inserta en index.html; cambiarlo exige nonce por petición y es una decisión aparte;
    # - connect-src 'self': el frontend y el BFF comparten origen (doc. 02 §8, CORS cerrado).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $cache_control always;

    # Solo se leen archivos.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Para el orquestador. Sin cabecera propia: lleva las del server.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # La API y el BFF no son de este servidor. Sin esto, una ruta mal enrutada caería en index.html y
    # el cliente recibiría HTML con un 200.
    location ~ ^/(api|bff|internal)/ {
        return 404;
    }

    # Un archivo con extensión que no existe es un error, no la aplicación.
    location ~* \.(js|css|map|ico|png|svg|woff2?|txt|json)$ {
        try_files $uri =404;
    }

    # Cualquier otra ruta es de la aplicación (el router de Angular la resuelve).
    location / {
        try_files $uri /index.html;
    }
}
