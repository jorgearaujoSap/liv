<ng-template #body>
  @if (iconName(); as name) {
    <liv-icon class="nav-item__icon" [name]="name" [size]="20" />
  }
  <span class="nav-item__label"><ng-content /></span>
  @if (type() === 'group' && !disabled()) {
    <liv-icon
      class="nav-item__chevron"
      [name]="expanded() ? 'chevron-down' : 'chevron-right'"
      [size]="16"
    />
  }
</ng-template>

@if (type() === 'group') {
  <button
    type="button"
    class="nav-item__control"
    [id]="controlId"
    [attr.aria-controls]="expanded() && !disabled() ? childrenId : null"
    [attr.aria-expanded]="disabled() ? null : expanded()"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.title]="disabled() ? disabledHint() : null"
    (click)="onGroupClick($event)"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </button>
  @if (expanded() && !disabled()) {
    <div
      class="nav-item__children"
      role="group"
      [id]="childrenId"
      [attr.aria-labelledby]="controlId"
    >
      <ng-content select="liv-nav-item" />
    </div>
  }
} @else {
  <a
    class="nav-item__control"
    [attr.href]="disabled() ? null : target()"
    [attr.role]="disabled() ? 'link' : null"
    [attr.aria-current]="active() && !disabled() ? 'page' : null"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.title]="disabled() ? disabledHint() : null"
    (click)="onLinkClick($event)"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </a>
}
