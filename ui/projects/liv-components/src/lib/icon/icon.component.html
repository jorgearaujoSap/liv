<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  focusable="false"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.role]="accessibleName() ? 'img' : null"
  [attr.aria-label]="accessibleName()"
  [attr.aria-hidden]="accessibleName() ? null : 'true'"
>
  @for (shape of shapes(); track $index) {
    @switch (shape.tag) {
      @case ('path') {
        <svg:path [attr.d]="shape.d" />
      }
      @case ('circle') {
        <svg:circle
          [attr.cx]="shape.cx"
          [attr.cy]="shape.cy"
          [attr.r]="shape.r"
          [attr.fill]="shape.fill ?? null"
        />
      }
      @case ('rect') {
        <svg:rect
          [attr.x]="shape.x"
          [attr.y]="shape.y"
          [attr.width]="shape.width"
          [attr.height]="shape.height"
          [attr.rx]="shape.rx"
          [attr.ry]="shape.ry ?? null"
        />
      }
      @case ('line') {
        <svg:line
          [attr.x1]="shape.x1"
          [attr.y1]="shape.y1"
          [attr.x2]="shape.x2"
          [attr.y2]="shape.y2"
        />
      }
    }
  }
</svg>
