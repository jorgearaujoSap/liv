<svg
  class="logo__mark"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 36 36"
  width="36"
  height="36"
  aria-hidden="true"
  focusable="false"
>
  <rect class="logo__tile" width="36" height="36" rx="9" />
  <polyline
    class="logo__letter"
    points="12.5,10 12.5,26 25,26"
    fill="none"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle class="logo__dot" cx="24.5" cy="11.5" r="2.75" />
</svg>
@if (showWordmark()) {
  <span class="logo__wordmark" aria-hidden="true">
    <span class="logo__name">LIV</span>
    <span class="logo__tagline">Impuesto vehicular</span>
  </span>
}
