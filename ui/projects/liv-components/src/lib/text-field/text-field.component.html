<label class="text-field__label" [for]="inputId">{{ label() }}</label>
<div class="text-field__control">
  @if (leadingIcon(); as icon) {
    <liv-icon class="text-field__icon" [name]="icon" [size]="20" />
  }
  <input
    class="text-field__input"
    [id]="inputId"
    [type]="type()"
    [value]="value()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.name]="name() ?? null"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.placeholder]="placeholder() ?? null"
    [attr.aria-invalid]="errorText() ? 'true' : null"
    [attr.aria-describedby]="message() ? messageId : null"
    [attr.spellcheck]="plainText() ? 'false' : null"
    [attr.autocapitalize]="plainText() ? 'none' : null"
    [attr.autocorrect]="plainText() ? 'off' : null"
    (input)="onInput($event)"
    (change)="onInput($event)"
  />
  <ng-content select="liv-icon-button" />
</div>
@if (message(); as text) {
  <p class="text-field__help" [id]="messageId">
    @if (errorText()) {
      <liv-icon name="circle-alert" [size]="16" />
    }
    <span>{{ text }}</span>
  </p>
}
